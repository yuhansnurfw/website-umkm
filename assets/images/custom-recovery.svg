<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Antarmuka Custom Recovery TWRP dan OrangeFox</title>
  <desc id="desc">Tampilan antarmuka menu Custom Recovery untuk proses install Custom ROM, wipe partisi, dan backup sistem.</desc>
  <rect width="640" height="360" fill="#0b1120" />
  <!-- Smartphone Frame Center -->
  <rect x="220" y="20" width="200" height="320" rx="20" fill="#020617" stroke="#38bdf8" stroke-width="3" />
  <!-- Screen Area -->
  <rect x="232" y="38" width="176" height="284" rx="8" fill="#1e1b4b" />
  <!-- Header Recovery (OrangeFox/TWRP style) -->
  <rect x="232" y="38" width="176" height="32" rx="4" fill="#ea580c" />
  <text x="320" y="58" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OrangeFox Recovery</text>
  <!-- Battery and Time bar -->
  <text x="242" y="58" fill="#ffedd5" font-family="monospace" font-size="9">10:00</text>
  <text x="396" y="58" fill="#ffedd5" font-family="monospace" font-size="9" text-anchor="end">98%</text>
  <!-- Grid Buttons 2x4 -->
  <!-- Install -->
  <rect x="244" y="85" width="70" height="42" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
  <text x="279" y="110" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Install</text>
  <!-- Wipe -->
  <rect x="326" y="85" width="70" height="42" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
  <text x="361" y="110" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Wipe</text>
  <!-- Backup -->
  <rect x="244" y="137" width="70" height="42" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
  <text x="279" y="162" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Backup</text>
  <!-- Restore -->
  <rect x="326" y="137" width="70" height="42" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
  <text x="361" y="162" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Restore</text>
  <!-- Mount -->
  <rect x="244" y="189" width="70" height="42" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
  <text x="279" y="214" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Mount</text>
  <!-- Advanced -->
  <rect x="326" y="189" width="70" height="42" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
  <text x="361" y="214" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Advanced</text>
  <!-- Reboot slider / status -->
  <rect x="244" y="245" width="152" height="30" rx="15" fill="#0f172a" stroke="#ea580c" stroke-width="1.5" />
  <text x="320" y="264" fill="#fed7aa" font-family="sans-serif" font-size="9" text-anchor="middle">Swipe to Confirm Flash</text>
  <!-- Side annotations -->
  <text x="120" y="140" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TWRP / OFOX</text>
  <text x="120" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Dukungan Partisi</text>
  <text x="120" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Dynamic &amp; A/B</text>
  <text x="520" y="140" fill="#f97316" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PBRP Ready</text>
  <text x="520" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Root &amp; KernelSU</text>
  <text x="520" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Auto-Decryption</text>
</svg>
