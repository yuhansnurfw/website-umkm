<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Proses Flashing dan Terminal Oprek</title>
  <desc id="desc">Tampilan jendela terminal Linux menjalankan perintah fastboot flashing firmware dan custom recovery.</desc>
  <rect width="640" height="360" fill="#090d16" />
  <!-- Terminal Window Frame -->
  <rect x="50" y="30" width="540" height="300" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <!-- Window Header -->
  <path d="M50 40 Q50 30 60 30 L580 30 Q590 30 590 40 L590 65 L50 65 Z" fill="#1e293b" />
  <circle cx="75" cy="48" r="6" fill="#ef4444" />
  <circle cx="95" cy="48" r="6" fill="#f59e0b" />
  <circle cx="115" cy="48" r="6" fill="#10b981" />
  <text x="320" y="52" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">terminal — oprek@station: ~/flash-tools</text>
  <!-- Terminal Lines -->
  <text x="75" y="95" fill="#38bdf8" font-family="monospace" font-size="12">$ fastboot devices</text>
  <text x="75" y="115" fill="#64748b" font-family="monospace" font-size="11">a3f901bc7d2e    fastboot</text>
  <text x="75" y="145" fill="#38bdf8" font-family="monospace" font-size="12">$ fastboot flash recovery orangefox-recovery.img</text>
  <text x="75" y="165" fill="#94a3b8" font-family="monospace" font-size="11">Sending 'recovery' (65536 KB)...</text>
  <text x="380" y="165" fill="#4ade80" font-family="monospace" font-size="11">OKAY [  1.420s]</text>
  <text x="75" y="185" fill="#94a3b8" font-family="monospace" font-size="11">Writing 'recovery'...</text>
  <text x="380" y="185" fill="#4ade80" font-family="monospace" font-size="11">OKAY [  0.312s]</text>
  <text x="75" y="215" fill="#38bdf8" font-family="monospace" font-size="12">$ fastboot flash boot boot-magisk-patched.img</text>
  <text x="75" y="235" fill="#94a3b8" font-family="monospace" font-size="11">Sending 'boot' (32768 KB)...</text>
  <text x="380" y="235" fill="#4ade80" font-family="monospace" font-size="11">OKAY [  0.780s]</text>
  <text x="75" y="265" fill="#facc15" font-family="monospace" font-size="12">[INFO] Flash firmware berhasil, sistem siap masuk Custom Recovery!</text>
  <!-- Terminal Cursor -->
  <text x="75" y="295" fill="#38bdf8" font-family="monospace" font-size="12">oprek@station:~$ </text>
  <rect x="220" y="283" width="9" height="15" fill="#38bdf8" />
</svg>
