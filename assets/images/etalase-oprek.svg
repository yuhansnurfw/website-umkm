<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Etalase Workstation JasaOprek</title>
  <desc id="desc">Meja kerja teknisi dengan laptop oprek, kabel flash USB, dan perangkat Android uji coba.</desc>
  <rect width="640" height="360" fill="#0f172a" />
  <!-- Meja kerja -->
  <rect y="260" width="640" height="100" fill="#1e293b" />
  <line x1="0" y1="260" x2="640" y2="260" stroke="#334155" stroke-width="3" />
  <!-- Laptop teknisi -->
  <rect x="80" y="90" width="220" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <rect x="95" y="105" width="190" height="110" rx="4" fill="#0284c7" fill-opacity="0.15" />
  <!-- Terminal teks di laptop -->
  <text x="105" y="125" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">jasaoprek@tech:~$</text>
  <text x="105" y="145" fill="#a5f3fc" font-family="monospace" font-size="10">adb devices -l</text>
  <text x="105" y="165" fill="#4ade80" font-family="monospace" font-size="10">device: fastboot authorized</text>
  <text x="105" y="185" fill="#facc15" font-family="monospace" font-size="10">Status: Ready to Flash</text>
  <!-- Base laptop -->
  <path d="M50 230 L330 230 L310 245 L70 245 Z" fill="#334155" />
  <rect x="160" y="233" width="60" height="5" rx="2" fill="#64748b" />
  <!-- Kabel USB menghubungkan laptop ke HP -->
  <path d="M300 238 C 340 238, 360 270, 390 260" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <!-- Smartphone Android Oprek -->
  <rect x="390" y="130" width="90" height="160" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="3" />
  <rect x="398" y="142" width="74" height="134" rx="6" fill="#1e293b" />
  <!-- Layar HP: Fastboot Mode -->
  <circle cx="435" cy="180" r="16" fill="#38bdf8" fill-opacity="0.2" />
  <text x="435" y="185" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">⚙</text>
  <text x="435" y="215" fill="#22d3ee" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">FASTBOOT</text>
  <text x="435" y="230" fill="#a5f3fc" font-family="monospace" font-size="7" text-anchor="middle">UNLOCKED</text>
  <circle cx="435" cy="283" r="3" fill="#64748b" />
  <!-- Flashdrive & Alat Oprek -->
  <rect x="520" y="240" width="55" height="18" rx="3" fill="#64748b" />
  <rect x="575" y="244" width="12" height="10" fill="#cbd5e1" />
  <text x="547" y="253" fill="#f8fafc" font-family="monospace" font-size="8" text-anchor="middle">USB 3.0</text>
  <!-- Badge JasaOprek -->
  <rect x="500" y="50" width="105" height="32" rx="6" fill="#0369a1" />
  <text x="552" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">JASA OPREK</text>
</svg>
