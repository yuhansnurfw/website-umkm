<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Dual-Boot Windows dan Arch Linux</title>
  <desc id="desc">Tampilan konfigurasi dual-boot GRUB bootloader menyatukan sistem operasi Arch Linux dan Windows 11.</desc>
  <rect width="640" height="360" fill="#0f172a" />
  <!-- GRUB Menu Frame -->
  <rect x="60" y="40" width="520" height="280" rx="8" fill="#020617" stroke="#0ea5e9" stroke-width="2" />
  <rect x="60" y="40" width="520" height="36" rx="6" fill="#0369a1" />
  <text x="320" y="63" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">GNU GRUB version 2.12 - JasaOprek Dual-Boot</text>
  <!-- Highlighted Menu Item: Arch Linux -->
  <rect x="80" y="95" width="480" height="36" rx="4" fill="#0284c7" />
  <text x="100" y="118" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">* Arch Linux (linux-zen kernel, optimized)</text>
  <!-- Other Menu Items -->
  <text x="100" y="155" fill="#94a3b8" font-family="monospace" font-size="12">  Arch Linux, with Linux linux-lts</text>
  <text x="100" y="190" fill="#38bdf8" font-family="monospace" font-size="12">  Windows Boot Manager (on /dev/nvme0n1p1 - Windows 11 Pro)</text>
  <text x="100" y="225" fill="#94a3b8" font-family="monospace" font-size="12">  Debian GNU/Linux 12 (bookworm fallback)</text>
  <text x="100" y="260" fill="#64748b" font-family="monospace" font-size="12">  UEFI Firmware Settings</text>
  <!-- Footer Note -->
  <line x1="80" y1="285" x2="560" y2="285" stroke="#334155" stroke-width="1" />
  <text x="320" y="305" fill="#a5f3fc" font-family="monospace" font-size="10" text-anchor="middle">Gunakan tombol panah untuk memilih OS. Waktu otomatis: 5 detik</text>
</svg>
